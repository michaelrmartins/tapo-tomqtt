# Telegraf input for tapo-tomqtt.
#
# Drop this file into /etc/telegraf/telegraf.d/ on the server that already runs
# Telegraf -> InfluxDB. It only adds an INPUT (subscribing to the plugs' MQTT
# topics); your existing [[outputs.influxdb...]] config is reused as-is.
#
#   sudo cp telegraf-tapo.conf /etc/telegraf/telegraf.d/
#   sudo telegraf --config /etc/telegraf/telegraf.conf \
#                 --config-directory /etc/telegraf/telegraf.d --test   # dry run
#   sudo systemctl restart telegraf

[[inputs.mqtt_consumer]]
  servers   = ["tcp://10.192.100.11:1883"]
  topics    = ["tapo/#"]
  qos       = 0
  client_id = "telegraf-tapo"
  # Anonymous broker: no username/password/TLS.

  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "tapo"
    # Use the plug's own read time instead of Telegraf's ingestion time.
    timestamp_path   = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"   # RFC3339 with offset

    # --- Tags (indexed, low-cardinality identifiers) ---
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "name"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "host"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "ssid"

    # --- Numeric fields ---
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "power_w"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "voltage_v"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "current_a"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "consumption_today_kwh"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "consumption_this_month_kwh"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "signal_level"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rssi"
      type = "int"

    # --- Boolean fields ---
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "led"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cloud_connection"
      type = "bool"

  # Note: "update_available" is intentionally not mapped - it is usually null,
  # and json_v2 would drop the whole metric on a null-typed field. "on_since"
  # is left out too (it is a timestamp string, not a metric value).
